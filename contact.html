<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết nối & Ủng hộ Tác giả</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      color: #333;
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    .card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .action-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    /* Email Button */
    .btn-email {
      background-color: #4a5568;
      color: #ffffff;
    }
    .btn-email:hover {
      background-color: #2d3748;
    }

    /* Buy Me a Coffee Button */
    .btn-coffee {
      background-color: #FFDD00;
      color: #000000;
    }
    .btn-coffee:hover {
      background-color: #f3d000;
    }

    /* Momo Button */
    .btn-momo {
      background-color: #a50064;
      color: #ffffff;
    }
    .btn-momo:hover {
      background-color: #880052;
    }

    .divider {
      margin: 20px 0;
      height: 1px;
      background-color: #e2e8f0;
    }

    .support-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0aec0;
      margin-bottom: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kết Nối Cùng Tác Giả ✉️</h2>
    <p>Cảm ơn bạn đã ghé thăm! Hãy gửi thư hoặc ủng hộ để giúp mình có thêm động lực sáng tạo nhé.</p>

    <div class="action-links">
      <!-- Liên hệ -->
      <a href="mailto:phuongtranlangit@gmail.com" class="btn btn-email">
        📧 Liên hệ / Gửi Mail
      </a>

      <div class="divider"></div>
      <div class="support-title">Ủng hộ tác giả</div>

      <!-- Buy Me a Coffee -->
      <a href="https://buymeacoffee.com/phuongtranlangit" target="_blank" rel="noopener noreferrer" class="btn btn-coffee">
        ☕ Buy Me a Coffee
      </a>

      <!-- MoMo -->
      <a href="https://me.momo.vn/phuongtranlangit" target="_blank" rel="noopener noreferrer" class="btn btn-momo">
        💸 Ủng hộ qua MoMo
      </a>
    </div>
  </div>

</body>
</html>
